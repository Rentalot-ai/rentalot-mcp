title = "rentalot-mcp gitleaks config"

# Commit-time secret scan (`make hooks`) and full-tree scan (`make secret-scan`).
[extend]
useDefault = true

[[allowlists]]
description = "gitignored local/build files and sops-encrypted files"
paths = [
  '''(^|/)[^/]+\.enc$''',
  '''(^|/)node_modules/''',
  '''^(dist|coverage|\.worktrees)/''',
  '''^\.env(\.[^/]+)?$''',
]

[[allowlists]]
description = "fake credentials in test fixtures"
paths = ['''^test/''', '''(^|/)__tests__/''', '''\.test\.ts$''']
